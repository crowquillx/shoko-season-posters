name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test
        run: dotnet test Shoko.SeasonPosters.slnx -c Release
      - name: Check the review page script
        run: node --check src/Web/Ui/app.js
